  - url: https://docs.trustwell.com/genesis/api/
    type: Documentation
  description: >-
    The Trustwell Genesis Supplements API provides formulation and regulatory compliance capabilities
    for dietary supplement manufacturers. Built on the same Genesis Foods GraphQL endpoint, it supports
    Supplement Facts label generation, ingredient declaration, allergen statements, and compliance with
    FDA dietary supplement regulations. The API enables integration of supplement formulation data into
    ERP and PLM systems.
